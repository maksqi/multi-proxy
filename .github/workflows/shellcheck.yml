name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check syntax
        run: for f in *.sh; do bash -n "$f"; done

      - name: Run ShellCheck
        run: shellcheck --severity=style ./*.sh
